<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>備品貸出管理システム</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-indigo-600 text-white rounded-xl shadow-md">
                        <i class="fa-solid font-bold fa-boxes-packing text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-slate-900 leading-tight">備品貸出管理システム</h1>
                        <p class="text-xs text-slate-500">実技試験・学内/社内設備共有ポータル</p>
                    </div>
                </div>

                <!-- User Auth Area -->
                <div class="flex items-center gap-3">
                    <button id="config-btn" title="Firebase設定" class="p-2 text-slate-500 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition-colors">
                        <i class="fa-solid fa-gear text-lg"></i>
                    </button>
                    
                    <div id="auth-container" class="flex items-center gap-3">
                        <button id="login-btn" class="hidden items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium text-sm transition-all shadow-sm">
                            <i class="fa-brands fa-google"></i>
                            <span>Googleでログイン</span>
                        </button>
                        
                        <div id="user-profile" class="hidden flex items-center gap-3 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200">
                            <img id="user-avatar" class="w-7 h-7 rounded-full border border-white" src="" alt="User Avatar">
                            <span id="user-name" class="text-xs font-semibold text-slate-700"></span>
                            <button id="logout-btn" title="ログアウト" class="text-slate-400 hover:text-rose-600 text-xs ml-1 transition-colors">
                                <i class="fa-solid fa-right-from-bracket"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="fixed top-20 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- Navigation Tabs & Search Bar -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
            <!-- Tabs -->
            <div class="flex bg-slate-200/80 p-1 rounded-xl w-full md:w-auto text-sm font-medium">
                <button id="tab-inventory" class="tab-btn flex-1 md:flex-none px-5 py-2 rounded-lg bg-white text-indigo-600 shadow-sm transition-all">
                    <i class="fa-solid fa-list mr-2"></i>備品一覧
                </button>
                <button id="tab-my-rentals" class="tab-btn flex-1 md:flex-none px-5 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition-all">
                    <i class="fa-solid fa-hand-holding mr-2"></i>マイ貸出履歴
                </button>
                <button id="tab-admin" class="tab-btn flex-1 md:flex-none px-5 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition-all">
                    <i class="fa-solid fa-plus-circle mr-2"></i>備品登録・管理
                </button>
            </div>

            <!-- Controls (Search & Filters) -->
            <div id="filter-controls" class="flex flex-wrap sm:flex-nowrap items-center gap-2">
                <div class="relative flex-grow sm:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" placeholder="備品名・カテゴリで検索..." class="w-full pl-9 pr-4 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <select id="status-filter" class="bg-white border border-slate-300 text-slate-700 text-sm rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="all">すべての状態</option>
                    <option value="available">貸出可能のみ</option>
                    <option value="borrowed">貸出中のみ</option>
                </select>
            </div>
        </div>

        <!-- VIEW 1: Equipment Inventory Grid -->
        <section id="view-inventory" class="tab-content">
            <div id="items-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Dynamically populated equipment cards -->
            </div>
            <div id="items-empty" class="hidden text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300">
                <i class="fa-solid fa-box-open text-4xl text-slate-300 mb-3"></i>
                <p class="text-slate-500 font-medium">該当する備品が見つかりません</p>
            </div>
        </section>

        <!-- VIEW 2: My Borrowed Items & History -->
        <section id="view-my-rentals" class="tab-content hidden">
            <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                <div class="p-4 sm:p-6 border-b border-slate-100 flex justify-between items-center">
                    <h2 class="font-bold text-slate-800 text-lg">現在貸出中の備品</h2>
                    <span id="active-rentals-count" class="bg-indigo-50 text-indigo-700 text-xs font-semibold px-2.5 py-1 rounded-full">0 件</span>
                </div>
                <div class="divide-y divide-slate-100" id="my-rentals-list">
                    <!-- Dynamic Rental Items -->
                </div>
                <div id="my-rentals-empty" class="text-center py-12 text-slate-400">
                    <i class="fa-solid fa-circle-check text-3xl mb-2 text-slate-300"></i>
                    <p class="text-sm">現在あなたが借用中の備品はありません</p>
                </div>
            </div>
        </section>

        <!-- VIEW 3: Admin & Add New Equipment -->
        <section id="view-admin" class="tab-content hidden">
            <div class="max-w-2xl mx-auto bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="text-xl font-bold text-slate-900 mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-boxes-stacked text-indigo-600"></i>
                    新規備品の登録
                </h2>
                <form id="add-item-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">備品名 *</label>
                        <input type="text" id="item-name" required placeholder="例: MacBook Pro 14インチ, プロジェクター" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-indigo-500">
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">カテゴリ *</label>
                            <select id="item-category" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-indigo-500">
                                <option value="PC・タブレット">PC・タブレット</option>
                                <option value="AV機器・撮影">AV機器・撮影</option>
                                <option value="実験・実技器具">実験・実技器具</option>
                                <option value="周辺機器・ケーブル">周辺機器・ケーブル</option>
                                <option value="その他">その他</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">管理番号 / Serial No.</label>
                            <input type="text" id="item-serial" placeholder="例: EQ-2026-001" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-indigo-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">画像URL (任意)</label>
                        <input type="url" id="item-image" placeholder="https://..." class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">説明・注意事項</label>
                        <textarea id="item-desc" rows="3" placeholder="スペック、付属品、取り扱い注意事項など" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-indigo-500"></textarea>
                    </div>

                    <div class="pt-2">
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg text-sm shadow duration-200 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-plus"></i>
                            <span>備品をデータベースに追加</span>
                        </button>
                    </div>
                </form>
            </div>
        </section>

    </main>

    <!-- Borrow Modal -->
    <div id="borrow-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative transform transition-all">
            <button id="close-borrow-modal" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 class="text-lg font-bold text-slate-900 mb-1">備品の貸出手続き</h3>
            <p id="borrow-item-title" class="text-sm font-medium text-indigo-600 mb-4"></p>
            
            <form id="borrow-form" class="space-y-4">
                <input type="hidden" id="borrow-item-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">返却予定日 *</label>
                    <input type="date" id="return-date" required class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">利用目的・使用場所 *</label>
                    <textarea id="borrow-purpose" required rows="2" placeholder="例: 実技試験練習、○号館101教室" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" id="cancel-borrow-btn" class="px-4 py-2 border border-slate-300 text-slate-600 text-sm rounded-lg hover:bg-slate-50">キャンセル</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 shadow-sm">貸出を確定する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase Config Modal -->
    <div id="config-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
            <button id="close-config-modal" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 class="text-lg font-bold text-slate-900 mb-2 flex items-center gap-2">
                <i class="fa-solid fa-sliders text-indigo-600"></i>
                Firebase設定 (GitHub Pages用)
            </h3>
            <p class="text-xs text-slate-500 mb-4">
                GitHub Pagesでアプリを運用する場合、ご自身のFirebaseプロジェクトの設定オブジェクト（JSON形式）を設定してください。情報はブラウザのローカルストレージに保存されます。
            </p>
            <form id="config-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">firebaseConfig (JSON format)</label>
                    <textarea id="config-json" rows="8" class="w-full p-3 font-mono text-xs bg-slate-900 text-emerald-400 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder='{
  "apiKey": "AIzaSy...",
  "authDomain": "your-app.firebaseapp.com",
  "projectId": "your-app",
  "storageBucket": "your-app.appspot.com",
  "messagingSenderId": "...",
  "appId": "..."
}'></textarea>
                </div>
                <div class="flex justify-between items-center pt-2">
                    <button type="button" id="reset-config-btn" class="text-xs text-rose-600 hover:underline">デフォルト設定に戻す</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700">保存して再起動</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase Script (ES Modules) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            signOut, 
            onAuthStateChanged,
            signInAnonymously,
            signInWithCustomToken
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            onSnapshot, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'equipment-app-2026';
        
        // Default Fallback Config (Can be overwritten via UI settings or code)
        const DEFAULT_FIREBASE_CONFIG = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "DEMO_KEY_PLEASE_CONFIGURE_YOUR_OWN",
                authDomain: "demo-app.firebaseapp.com",
                projectId: "demo-app",
                storageBucket: "demo-app.appspot.com",
                messagingSenderId: "000000000",
                appId: "1:000000000:web:000000000"
            };

        // Load config from LocalStorage if available
        let activeConfig = DEFAULT_FIREBASE_CONFIG;
        const storedConfig = localStorage.getItem('custom_firebase_config');
        if (storedConfig) {
            try {
                activeConfig = JSON.parse(storedConfig);
            } catch (e) {
                console.error("Stored firebase config invalid", e);
            }
        }

        // Global State variables
        let app, auth, db;
        let currentUser = null;
        let allItems = [];
        let unsubscribeSync = null;

        async function initFirebase() {
            try {
                app = initializeApp(activeConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                
                // Auth Observer
                onAuthStateChanged(auth, (user) => {
                    currentUser = user;
                    updateUserUI();
                    
                    // Auth completed: setup realtime sync only when user is available
                    if (user) {
                        setupRealtimeSync();
                    } else {
                        renderInventory();
                        renderMyRentals();
                    }
                });

                // Auto Authenticate FIRST (Custom Token or Anonymous fallback)
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

            } catch (err) {
                console.error("Firebase Init Error:", err);
                showToast("Firebase初期化または自動接続に失敗しました。設定を確認してください。", "error");
            }
        }

        function setupRealtimeSync() {
            if (!db || !currentUser) return;

            // Unsubscribe existing listener if any
            if (unsubscribeSync) {
                unsubscribeSync();
            }

            // Strict Mandatory Path Requirement Rules
            const publicCollectionRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'items');

            unsubscribeSync = onSnapshot(publicCollectionRef, (snapshot) => {
                allItems = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                renderInventory();
                renderMyRentals();
            }, (error) => {
                console.error("Firestore Listen Error:", error);
                showToast("データ読み取り権限エラーが発生しました", "error");
            });
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgClass = type === 'error' ? 'bg-rose-600' : type === 'success' ? 'bg-emerald-600' : 'bg-slate-800';
            const iconClass = type === 'error' ? 'fa-triangle-exclamation' : type === 'success' ? 'fa-circle-check' : 'fa-circle-info';

            toast.className = `${bgClass} text-white text-sm px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${iconClass}"></i><span>${message}</span>`;
            
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4500);
        }

        async function handleLogin() {
            try {
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
                showToast("ログインに成功しました", "success");
            } catch (error) {
                console.error("Login Error:", error);
                if (error.code === 'auth/unauthorized-domain') {
                    showToast("このドメインからのGoogleログインは拒否されました。Firebase Consoleの「Authentication > 設定 > 承認済みドメイン」に現在のドメインを追加してください。", "error");
                } else {
                    showToast("ログイン処理に失敗しました: " + error.message, "error");
                }
            }
        }

        async function handleLogout() {
            try {
                await signOut(auth);
                // Re-authenticate anonymously for basic functionality
                await signInAnonymously(auth);
                showToast("ログアウトしました", "info");
            } catch (error) {
                console.error("Logout Error:", error);
            }
        }

        function updateUserUI() {
            const loginBtn = document.getElementById('login-btn');
            const userProfile = document.getElementById('user-profile');
            const userName = document.getElementById('user-name');
            const userAvatar = document.getElementById('user-avatar');

            // Show user info if logged in with non-anonymous Google account
            if (currentUser && !currentUser.isAnonymous) {
                loginBtn.classList.add('hidden');
                userProfile.classList.remove('hidden');
                userProfile.classList.add('flex');
                userName.textContent = currentUser.displayName || currentUser.email;
                userAvatar.src = currentUser.photoURL || `https://placehold.co/100x100/6366f1/ffffff?text=${(currentUser.displayName||'U').charAt(0)}`;
            } else {
                loginBtn.classList.remove('hidden');
                loginBtn.classList.add('flex');
                userProfile.classList.add('hidden');
                userProfile.classList.remove('flex');
            }
        }

        function renderInventory() {
            const container = document.getElementById('items-grid');
            const emptyState = document.getElementById('items-empty');
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            const statusFilter = document.getElementById('status-filter').value;

            const filtered = allItems.filter(item => {
                const matchesSearch = (item.name || '').toLowerCase().includes(searchQuery) || 
                                      (item.category || '').toLowerCase().includes(searchQuery) ||
                                      (item.serial || '').toLowerCase().includes(searchQuery);
                
                const isBorrowed = !!item.borrowedBy;
                let matchesStatus = true;
                if (statusFilter === 'available') matchesStatus = !isBorrowed;
                if (statusFilter === 'borrowed') matchesStatus = isBorrowed;

                return matchesSearch && matchesStatus;
            });

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            container.innerHTML = filtered.map(item => {
                const isBorrowed = !!item.borrowedBy;
                const isMyRental = currentUser && item.borrowedBy?.uid === currentUser.uid;
                const fallbackImg = 'https://placehold.co/400x300/f1f5f9/94a3b8?text=No+Image';

                return `
                    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition-shadow flex flex-col">
                        <div class="h-44 bg-slate-100 relative overflow-hidden">
                            <img src="${item.imageUrl || fallbackImg}" 
                                 onerror="this.src='${fallbackImg}'" 
                                 alt="${item.name}" 
                                 class="w-full h-full object-cover">
                            
                            <span class="absolute top-3 left-3 text-xs font-bold px-2.5 py-1 rounded-full ${isBorrowed ? 'bg-amber-100 text-amber-800 border border-amber-300' : 'bg-emerald-100 text-emerald-800 border border-emerald-300'}">
                                ${isBorrowed ? '<i class="fa-solid fa-clock mr-1"></i>貸出中' : '<i class="fa-solid fa-check mr-1"></i>貸出可'}
                            </span>

                            <span class="absolute top-3 right-3 text-xs font-medium bg-slate-900/70 text-white backdrop-blur-sm px-2.5 py-1 rounded-lg">
                                ${item.category || 'その他'}
                            </span>
                        </div>

                        <div class="p-4 flex-grow flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-slate-900 text-base mb-1 line-clamp-1" title="${item.name}">${item.name}</h3>
                                <p class="text-xs text-slate-400 mb-2 font-mono">ID: ${item.serial || item.id.substring(0,8)}</p>
                                <p class="text-xs text-slate-600 line-clamp-2 mb-4">${item.description || '説明なし'}</p>
                            </div>

                            <div class="pt-3 border-t border-slate-100">
                                ${isBorrowed ? `
                                    <div class="mb-3 bg-slate-50 p-2 rounded-lg text-xs">
                                        <div class="text-slate-500">借用者: <span class="font-semibold text-slate-700">${item.borrowedBy?.name || '不明'}</span></div>
                                        <div class="text-slate-500">返却予定: <span class="font-semibold text-indigo-600">${item.returnDate || '未定'}</span></div>
                                    </div>
                                    ${isMyRental ? `
                                        <button onclick="returnItem('${item.id}')" class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold shadow-sm transition-colors">
                                            <i class="fa-solid fa-rotate-left mr-1"></i>返却する
                                        </button>
                                    ` : `
                                        <button disabled class="w-full py-2 bg-slate-100 text-slate-400 rounded-lg text-xs font-semibold cursor-not-allowed">
                                            貸出不可
                                        </button>
                                    `}
                                ` : `
                                    <button onclick="openBorrowModal('${item.id}', '${item.name}')" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow-sm transition-colors">
                                        <i class="fa-solid fa-hand-holding mr-1"></i>貸出申請
                                    </button>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderMyRentals() {
            const container = document.getElementById('my-rentals-list');
            const emptyState = document.getElementById('my-rentals-empty');
            const countBadge = document.getElementById('active-rentals-count');

            if (!currentUser) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.querySelector('p').textContent = "ログインすると借用中の備品が表示されます";
                countBadge.textContent = "0 件";
                return;
            }

            const myItems = allItems.filter(item => item.borrowedBy?.uid === currentUser.uid);
            countBadge.textContent = `${myItems.length} 件`;

            if (myItems.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.querySelector('p').textContent = "現在あなたが借用中の備品はありません";
                return;
            }

            emptyState.classList.add('hidden');
            container.innerHTML = myItems.map(item => `
                <div class="p-4 sm:p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-lg bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600 flex-shrink-0">
                            <i class="fa-solid fa-box text-xl"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-slate-900 text-sm mb-0.5">${item.name}</h4>
                            <div class="flex flex-wrap gap-2 text-xs text-slate-500">
                                <span><i class="fa-solid fa-tag mr-1"></i>${item.category}</span>
                                <span>•</span>
                                <span class="text-indigo-600 font-medium"><i class="fa-regular fa-calendar-check mr-1"></i>返却期限: ${item.returnDate}</span>
                            </div>
                            <p class="text-xs text-slate-500 mt-1">用途: ${item.purpose || '記載なし'}</p>
                        </div>
                    </div>
                    <button onclick="returnItem('${item.id}')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold shadow-sm transition-colors w-full sm:w-auto">
                        <i class="fa-solid fa-rotate-left mr-1"></i>返却完了手続き
                    </button>
                </div>
            `).join('');
        }

        window.openBorrowModal = (itemId, itemName) => {
            if (!currentUser) {
                showToast("備品を借りるにはGoogleログインが必要です", "error");
                return;
            }
            document.getElementById('borrow-item-id').value = itemId;
            document.getElementById('borrow-item-title').textContent = itemName;
            
            // Set default return date to tomorrow
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('return-date').value = tomorrow.toISOString().split('T')[0];
            
            document.getElementById('borrow-modal').classList.remove('hidden');
        };

        window.returnItem = async (itemId) => {
            if (!currentUser) return;

            try {
                const docRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'items', itemId);
                await updateDoc(docRef, {
                    borrowedBy: null,
                    borrowedAt: null,
                    returnDate: null,
                    purpose: null
                });
                showToast("返却手続きが完了しました", "success");
            } catch (error) {
                console.error("Return Error:", error);
                showToast("返却処理に失敗しました", "error");
            }
        };

        document.getElementById('login-btn').addEventListener('click', handleLogin);
        document.getElementById('logout-btn').addEventListener('click', handleLogout);

        // Search & Filter Listeners
        document.getElementById('search-input').addEventListener('input', renderInventory);
        document.getElementById('status-filter').addEventListener('change', renderInventory);

        // Tab Navigation
        const tabs = [
            { id: 'tab-inventory', view: 'view-inventory' },
            { id: 'tab-my-rentals', view: 'view-my-rentals' },
            { id: 'tab-admin', view: 'view-admin' }
        ];

        tabs.forEach(tab => {
            document.getElementById(tab.id).addEventListener('click', () => {
                tabs.forEach(t => {
                    const btn = document.getElementById(t.id);
                    const view = document.getElementById(t.view);
                    if (t.id === tab.id) {
                        btn.className = "tab-btn flex-1 md:flex-none px-5 py-2 rounded-lg bg-white text-indigo-600 shadow-sm transition-all";
                        view.classList.remove('hidden');
                    } else {
                        btn.className = "tab-btn flex-1 md:flex-none px-5 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition-all";
                        view.classList.add('hidden');
                    }
                });
            });
        });

        // Modal Close Listeners
        document.getElementById('close-borrow-modal').addEventListener('click', () => {
            document.getElementById('borrow-modal').classList.add('hidden');
        });
        document.getElementById('cancel-borrow-btn').addEventListener('click', () => {
            document.getElementById('borrow-modal').classList.add('hidden');
        });

        // Borrow Form Submit
        document.getElementById('borrow-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const itemId = document.getElementById('borrow-item-id').value;
            const returnDate = document.getElementById('return-date').value;
            const purpose = document.getElementById('borrow-purpose').value;

            if (!currentUser) {
                showToast("ログイン情報が取得できません", "error");
                return;
            }

            try {
                const docRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'items', itemId);
                await updateDoc(docRef, {
                    borrowedBy: {
                        uid: currentUser.uid,
                        name: currentUser.displayName || currentUser.email,
                        email: currentUser.email
                    },
                    borrowedAt: new Date().toISOString(),
                    returnDate: returnDate,
                    purpose: purpose
                });

                document.getElementById('borrow-modal').classList.add('hidden');
                document.getElementById('borrow-purpose').value = '';
                showToast("貸出手続きが完了しました", "success");
            } catch (error) {
                console.error("Borrow Submit Error:", error);
                showToast("貸出登録に失敗しました", "error");
            }
        });

        // Admin Add Item Form
        document.getElementById('add-item-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) {
                showToast("備品の登録にはGoogleログインが必要です", "error");
                return;
            }

            const name = document.getElementById('item-name').value;
            const category = document.getElementById('item-category').value;
            const serial = document.getElementById('item-serial').value;
            const imageUrl = document.getElementById('item-image').value;
            const description = document.getElementById('item-desc').value;

            try {
                const publicCollectionRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'items');
                await addDoc(publicCollectionRef, {
                    name,
                    category,
                    serial: serial || `EQ-${Date.now().toString().slice(-4)}`,
                    imageUrl: imageUrl || null,
                    description,
                    createdAt: serverTimestamp(),
                    borrowedBy: null
                });

                showToast("新しい備品を登録しました", "success");
                document.getElementById('add-item-form').reset();
                
                // Switch back to inventory tab
                document.getElementById('tab-inventory').click();

            } catch (error) {
                console.error("Add Item Error:", error);
                showToast("備品登録に失敗しました", "error");
            }
        });

        // Firebase Config Modal Controls
        const configModal = document.getElementById('config-modal');
        document.getElementById('config-btn').addEventListener('click', () => {
            document.getElementById('config-json').value = JSON.stringify(activeConfig, null, 2);
            configModal.classList.remove('hidden');
        });
        document.getElementById('close-config-modal').addEventListener('click', () => {
            configModal.classList.add('hidden');
        });

        document.getElementById('config-form').addEventListener('submit', (e) => {
            e.preventDefault();
            try {
                const newConfig = JSON.parse(document.getElementById('config-json').value);
                localStorage.setItem('custom_firebase_config', JSON.stringify(newConfig));
                showToast("設定を保存しました。再読み込みします...", "success");
                setTimeout(() => window.location.reload(), 1000);
            } catch (err) {
                showToast("有効なJSON形式ではありません", "error");
            }
        });

        document.getElementById('reset-config-btn').addEventListener('click', () => {
            localStorage.removeItem('custom_firebase_config');
            showToast("デフォルト設定に戻しました。再読み込みします...", "info");
            setTimeout(() => window.location.reload(), 1000);
        });

        window.addEventListener('DOMContentLoaded', () => {
            initFirebase();
        });
    </script>
</body>
</html>
